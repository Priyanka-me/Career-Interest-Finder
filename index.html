<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Interest Finder</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Stream Selection Styles */
        .grid-streams {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-stream {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-stream:hover {
            border-color: var(--primary);
            background: #e0e7ff;
            color: var(--primary);
            transform: translateY(-2px);
        }

        /* Card Section Styles */
        .progress-bar {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .card-img-wrapper {
            width: 100%;
            height: 260px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            background-color: #f1f5f9;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-description {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.4;
            min-height: 40px;
        }

        .actions-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-love {
            background-color: #dcfce7;
            color: #15803d;
            border: 2px solid #bbf7d0;
        }

        .btn-love:hover {
            background-color: #bbf7d0;
            transform: translateY(-2px);
        }

        .btn-not {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 2px solid #fecaca;
        }

        .btn-not:hover {
            background-color: #fecaca;
            transform: translateY(-2px);
        }

        /* Result Screen Styles */
        .result-badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .result-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .degree-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .degree-box h4 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .degree-box ul {
            list-style-position: inside;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-restart {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-restart:hover {
            background: var(--primary-hover);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Career Interest Finder</h1>
        <p class="subtitle" id="sub-heading">Discover your natural career vibe in 3 minutes.</p>

        <!-- STEP 1: Stream Selection Screen -->
        <div id="screen-stream">
            <div class="grid-streams">
                <button class="btn-stream" onclick="startTest('PCB')">PCB</button>
                <button class="btn-stream" onclick="startTest('PCM')">PCM</button>
                <button class="btn-stream" onclick="startTest('Commerce')">Commerce</button>
                <button class="btn-stream" onclick="startTest('Arts')">Arts</button>
            </div>
        </div>

        <!-- STEP 2: Cards Swiping Screen -->
        <div id="screen-cards" class="hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="card-img-wrapper">
                <img id="card-img" src="" alt="Work Vibe">
            </div>

            <div class="card-title" id="card-title">Loading...</div>
            <div class="card-description" id="card-desc">...</div>

            <div class="actions-group">
                <button class="btn-action btn-not" onclick="handleChoice(false)">✖ Not for Me</button>
                <button class="btn-action btn-love" onclick="handleChoice(true)">❤️ Love the Vibe</button>
            </div>
        </div>

        <!-- STEP 3: Result Display Screen -->
        <div id="screen-result" class="hidden">
            <span class="result-badge">Top Match Found</span>
            <h2 class="result-title" id="res-cluster">...</h2>
            <p class="card-description" id="res-desc">...</p>

            <div class="degree-box">
                <h4>RECOMMENDED DEGREE TRACKS:</h4>
                <ul id="res-degrees"></ul>
            </div>

            <button class="btn-restart" onclick="restart()">Try Another Stream</button>
        </div>
    </div>

        // State Tracking
        let currentStreamCards = [];
        let currentIndex = 0;
        let clusterScores = {};

        function startTest(stream) {
            currentStreamCards = cardDatabase[stream];
            currentIndex = 0;
            clusterScores = {};

            // Initialize scores for all clusters in this stream to 0
            currentStreamCards.forEach(card => {
                clusterScores[card.cluster] = 0;
            });

            // UI Adjustments
            document.getElementById('screen-stream').classList.add('hidden');
            document.getElementById('screen-cards').classList.remove('hidden');
            document.getElementById('sub-heading').innerText = stream + " Vibe Check: React to each environment.";

            showCard();
        }

        function showCard() {
            if (currentIndex >= currentStreamCards.length) {
                renderResult();
                return;
            }

            const card = currentStreamCards[currentIndex];
            document.getElementById('card-img').src = card.img;
            document.getElementById('card-title').innerText = card.title;
            document.getElementById('card-desc').innerText = card.desc;

            // Update Progress Bar
            const progress = ((currentIndex) / currentStreamCards.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function handleChoice(isLoved) {
            const currentCard = currentStreamCards[currentIndex];
            if (isLoved) {
                clusterScores[currentCard.cluster] += 1;
            }

            currentIndex++;
            showCard();
        }

        function renderResult() {
            document.getElementById('screen-cards').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('sub-heading').innerText = "Your career direction is ready!";

            // Find cluster with highest score
            let topCluster = "";
            let maxScore = -1;

            for (const cluster in clusterScores) {
                if (clusterScores[cluster] > maxScore) {
                    maxScore = clusterScores[cluster];
                    topCluster = cluster;
                }
            }

            // Find matching degrees for this top cluster from card database
            const winningSample = currentStreamCards.find(c => c.cluster === topCluster);

            document.getElementById('res-cluster').innerText = topCluster;
            document.getElementById('res-desc').innerText = `You reacted most positively to visual environments in ${topCluster}. You naturally enjoy tasks and vibes in this domain.`;

            const degreeList = document.getElementById('res-degrees');
            degreeList.innerHTML = "";
            winningSample.degrees.forEach(deg => {
                const li = document.createElement('li');
                li.innerText = deg;
                degreeList.appendChild(li);
            });
        }

        function restart() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-stream').classList.remove('hidden');
            document.getElementById('sub-heading').innerText = "Discover your natural career vibe in 3 minutes.";
            document.getElementById('progress-fill').style.width = '0%';
        }
    </script>
</body>
</html>
