<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Vibe Check</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.4;
        }

        /* Stream Selector Cards */
        .grid-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            margin-top: 8px;
        }

        .btn-stream {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 22px 14px;
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .btn-stream:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-stream.pcb:hover { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-stream.pcm:hover { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .btn-stream.comm:hover { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-stream.arts:hover { background: linear-gradient(135deg, #ec4899, #be185d); }

        /* Card Stage Screen */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .card {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .card-img-wrapper {
            width: 100%;
            height: 230px;
            overflow: hidden;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.03);
        }

        .card-body {
            padding: 18px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.45;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 14px;
            width: 100%;
        }

        .btn-action {
            flex: 1;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-dislike {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-dislike:hover {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-like {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .btn-like:hover {
            background: #22c55e;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }

        /* Results Display */
        .result-box {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .result-title {
            font-size: 1.35rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .result-desc {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .degree-list {
            list-style-type: none;
        }

        .degree-list li {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #f8fafc;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .degree-list li::before {
            content: "✦";
            color: #38bdf8;
        }

        .empty-warning {
            border-color: rgba(239, 68, 68, 0.4) !important;
            background: rgba(239, 68, 68, 0.08) !important;
        }

        .empty-warning .result-title {
            background: linear-gradient(90deg, #f87171, #fb923c) !important;
            -webkit-background-clip: text ! summit;
            -webkit-text-fill-color: transparent;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Career Vibe Check</h1>
        <p class="subtitle" id="sub-heading">Discover your natural career path in 3 minutes.</p>
    </header>

    <!-- SCREEN 1: STREAM SELECTION -->
    <div id="screen-stream" class="grid-select">
        <button class="btn-stream pcb" onclick="startTest('PCB')">PCB<br><span style="font-size: 0.75rem; opacity: 0.8; font-weight: 400;">Biology</span></button>
        <button class="btn-stream pcm" onclick="startTest('PCM')">PCM<br><span style="font-size: 0.75rem; opacity: 0.8; font-weight: 400;">Maths</span></button>
        <button class="btn-stream comm" onclick="startTest('Commerce')">Commerce<br><span style="font-size: 0.75rem; opacity: 0.8; font-weight: 400;">Finance</span></button>
        <button class="btn-stream arts" onclick="startTest('Arts')">Arts<br><span style="font-size: 0.75rem; opacity: 0.8; font-weight: 400;">Humanities</span></button>
    </div>

    <!-- SCREEN 2: CARD SWIPING -->
    <div id="screen-cards" class="hidden" style="width: 100%;">
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <div class="card">
            <div class="card-img-wrapper">
                <img id="card-img" src="" alt="Workplace Scenario">
            </div>
            <div class="card-body">
                <div id="card-title" class="card-title"></div>
                <div id="card-desc" class="card-desc"></div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-action btn-dislike" onclick="handleChoice(false)">✖ Pass</button>
            <button class="btn-action btn-like" onclick="handleChoice(true)">♥ Like</button>
        </div>
    </div>

    <!-- SCREEN 3: RESULTS -->
    <div id="screen-result" class="hidden" style="width: 100%;">
        <div id="result-card-box" class="result-box">
            <div id="res-cluster" class="result-title"></div>
            <div id="res-desc" class="result-desc"></div>
            
            <div id="degree-section">
                <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Recommended Pathways:</p>
                <ul id="res-degrees" class="degree-list"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    const cardDatabase = {
        PCB: [
            {
                cluster: "Clinical Medicine & Patient Care",
                title: "Doctor & Hospital Care",
                desc: "Working directly with patients, reading X-rays/scans, and prescribing treatment in clinics or ICUs.",
                img: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=600&q=80",
                degrees: ["MBBS", "BDS (Dental)", "BAMS / BHMS", "B.Sc Nursing"]
            },
            {
                cluster: "Clinical Medicine & Patient Care",
                title: "Surgeon & Operating Room",
                desc: "Performing surgical operations, managing emergency procedures, and handling patient recovery.",
                img: "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=600&q=80",
                degrees: ["MBBS + Specialization (MD/MS)", "B.Sc Operation Theatre Tech"]
            },
            {
                cluster: "Biotech & Research Labs",
                title: "Lab Scientist & Geneticist",
                desc: "Testing DNA, analyzing chemical samples under microscopes, and conducting biological experiments.",
                img: "https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Sc Biotechnology", "B.Sc Microbiology", "B.Tech Bioprocess Engineering"]
            },
            {
                cluster: "Biotech & Research Labs",
                title: "Pharmacist & Medicine Research",
                desc: "Formulating vaccines, manufacturing tablets, and testing new pharmaceutical drugs.",
                img: "https://images.unsplash.com/photo-1587854692152-cbe660dbde88?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Pharmacy", "Pharm.D", "B.Sc Biochemistry"]
            },
            {
                cluster: "Psychology & Behavioral Science",
                title: "Counselor & Clinical Psychologist",
                desc: "Listening to patients, conducting 1-on-1 therapy sessions, and helping resolve mental health issues.",
                img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80",
                degrees: ["BA / B.Sc Psychology", "M.Sc Clinical Psychology"]
            },
            {
                cluster: "Allied Health & Diagnostic Technology",
                title: "Radiologist & Scan Technician",
                desc: "Operating MRI scanners, CT scan machines, and analyzing internal body imaging for diagnosis.",
                img: "https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Sc Radiology & Imaging Tech", "B.Sc Cardiac Care Tech"]
            },
            {
                cluster: "Allied Health & Diagnostic Technology",
                title: "Physiotherapist & Rehab Specialist",
                desc: "Helping athletes and injured patients recover muscle movement through physical exercises.",
                img: "https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=600&q=80",
                degrees: ["BPT (Bachelor of Physiotherapy)", "B.Sc Sports Science"]
            },
            {
                cluster: "Nutrition & Agri-Tech",
                title: "Dietitian & Food Technologist",
                desc: "Calculating nutritional values, creating dietary meal plans, and testing food product safety.",
                img: "https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Sc Nutrition & Dietetics", "B.Tech Food Technology"]
            }
        ],
        PCM: [
            {
                cluster: "Software, AI & Data Engineering",
                title: "Software Developer & Coder",
                desc: "Writing real code on multi-monitor setups, building mobile apps, websites, and backend databases.",
                img: "https://images.unsplash.com/photo-1542831371-29b0f74f9713?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Tech Computer Science", "BCA", "B.Sc CS"]
            },
            {
                cluster: "Software, AI & Data Engineering",
                title: "AI & Machine Learning Engineer",
                desc: "Building neural networks, training AI models, and coding automated machine learning algorithms.",
                img: "https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Tech AI & Data Science", "B.Sc Data Science"]
            },
            {
                cluster: "Core Hardware & Robotics",
                title: "Robotics & Automation Engineer",
                desc: "Assembling robotic arms, soldering microchips, and testing automated hardware devices.",
                img: "https://images.unsplash.com/photo-1563770660941-20978e870e26?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Tech Robotics", "B.Tech Mechanical", "B.Tech Electrical"]
            },
            {
                cluster: "Core Hardware & Robotics",
                title: "Electronics & Circuit Designer",
                desc: "Designing PCB circuit boards, microprocessors, and hardware for smartphones and IoT devices.",
                img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Tech ECE (Electronics & Comm)", "B.Sc Electronics"]
            },
            {
                cluster: "Architecture & Structural Design",
                title: "Architect & 3D Building Designer",
                desc: "Drawing structural floor plans, designing 3D building models, and planning urban layouts.",
                img: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Arch (Bachelor of Architecture)", "B.Des Interior Design"]
            },
            {
                cluster: "Architecture & Structural Design",
                title: "Civil Construction Engineer",
                desc: "Supervising real construction sites, testing concrete materials, and inspecting building safety.",
                img: "https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Tech Civil Engineering", "B.Plan (Urban Planning)"]
            },
            {
                cluster: "Aerospace & Automotive Engineering",
                title: "Automobile & EV Engineer",
                desc: "Designing electric vehicle engines, car aerodynamics, and manufacturing automotive chassis.",
                img: "https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Tech Automobile Engineering", "B.Tech Mechanical"]
            }
        ],
        Commerce: [
            {
                cluster: "Corporate Finance & Valuation",
                title: "Financial Analyst & Excel Modeler",
                desc: "Building financial valuation models on spreadsheets, analyzing stock ratios, and balance sheets.",
                img: "https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Com Finance / Hons", "BBA Finance", "CA / CFA Pathway"]
            },
            {
                cluster: "Corporate Finance & Valuation",
                title: "Stock Trader & Investment Analyst",
                desc: "Tracking live stock market charts, analyzing company earnings, and managing stock portfolios.",
                img: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80",
                degrees: ["BFM (Financial Markets)", "BBA Finance"]
            },
            {
                cluster: "Business Strategy & Management",
                title: "Startup Manager & Team Leader",
                desc: "Pitching decks in meeting rooms, setting team targets, and managing business operations.",
                img: "https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=600&q=80",
                degrees: ["BBA", "BMS (Management Studies)"]
            },
            {
                cluster: "Digital Marketing & Growth",
                title: "Digital Marketer & Ad Specialist",
                desc: "Creating social media ad campaigns, analyzing click rates, and optimizing marketing funnels.",
                img: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=600&q=80",
                degrees: ["BBA Marketing", "BMM (Mass Media)"]
            },
            {
                cluster: "Auditing, Tax & Compliance",
                title: "Chartered Accountant & Auditor",
                desc: "Auditing tax filings, verifying ledger books, and ensuring GST legal compliance for businesses.",
                img: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Com Accounting & Finance (BAF)", "CA / CS Foundation"]
            }
        ],
        Arts: [
            {
                cluster: "UI/UX & Digital Design",
                title: "UI/UX App Designer",
                desc: "Designing mobile app screens, button layouts, and user workflows on digital tablets and laptops.",
                img: "https://images.unsplash.com/photo-1581291518633-83b4ebd1d83e?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Des Interaction / UI-UX", "B.Sc Visual Communication"]
            },
            {
                cluster: "UI/UX & Digital Design",
                title: "Graphic & Poster Designer",
                desc: "Creating vector graphics, brand logos, typography, and visual media on graphic tablets.",
                img: "https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&w=600&q=80",
                degrees: ["B.Des Graphic Design", "BFA (Fine Arts)"]
            },
            {
                cluster: "Media, Journalism & Content Creation",
                title: "Video Editor & Film Director",
                desc: "Editing video timelines, directing camera crews, and managing post-production film editing.",
                img: "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=600&q=80",
                degrees: ["BA Film Making & Editing", "BMM (Mass Media)"]
            },
            {
                cluster: "Media, Journalism & Content Creation",
                title: "Journalist & News Reporter",
                desc: "Reporting live events on camera, writing news articles, and conducting interview stories.",
                img: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=600&q=80",
                degrees: ["BA Journalism & Mass Comm", "BA English Literature"]
            },
            {
                cluster: "Law, Governance & Public Policy",
                title: "Lawyer & Legal Advocate",
                desc: "Studying law books, drafting legal notices, and presenting arguments in judicial courtrooms.",
                img: "https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=600&q=80",
                degrees: ["BA LLB (5-Year Integrated)", "BBA LLB"]
            }
        ]
    };

    let currentStreamCards = [];
    let currentIndex = 0;
    let clusterScores = {};
    let totalLikes = 0;

    function startTest(stream) {
        currentStreamCards = cardDatabase[stream];
        currentIndex = 0;
        totalLikes = 0;
        clusterScores = {};

        currentStreamCards.forEach(card => {
            clusterScores[card.cluster] = 0;
        });

        document.getElementById('screen-stream').classList.add('hidden');
        document.getElementById('screen-cards').classList.remove('hidden');
        document.getElementById('sub-heading').innerText = stream + " Vibe Check: React to each workplace.";

        showCard();
    }

    function showCard() {
        if (currentIndex >= currentStreamCards.length) {
            renderResult();
            return;
        }

        const card = currentStreamCards[currentIndex];
        document.getElementById('card-img').src = card.img;
        document.getElementById('card-title').innerText = card.title;
        document.getElementById('card-desc').innerText = card.desc;

        const progress = ((currentIndex) / currentStreamCards.length) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
    }

    function handleChoice(isLoved) {
        const currentCard = currentStreamCards[currentIndex];
        if (isLoved) {
            clusterScores[currentCard.cluster] += 1;
            totalLikes += 1;
        }

        currentIndex++;
        showCard();
    }

    function renderResult() {
        document.getElementById('screen-cards').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
        document.getElementById('sub-heading').innerText = "Assessment Complete!";

        const resultCardBox = document.getElementById('result-card-box');
        const degreeSection = document.getElementById('degree-section');

        // Check if student passed on ALL options
        if (totalLikes === 0) {
            resultCardBox.classList.add('empty-warning');
            document.getElementById('res-cluster').innerText = "No Preferences Selected";
            document.getElementById('res-desc').innerText = "You have given a pass to all of the career options presented. Because you did not like any options, no career path can be predicted for you. Please choose the option that you like the most.";
            degreeSection.style.display = "none";
            return;
        }

        // Standard result flow if at least 1 option was liked
        resultCardBox.classList.remove('empty-warning');
        degreeSection.style.display = "block";

        let topCluster = "";
        let maxScore = -1;

        for (const cluster in clusterScores) {
            if (clusterScores[cluster] > maxScore) {
                maxScore = clusterScores[cluster];
                topCluster = cluster;
            }
        }

        const winningSample = currentStreamCards.find(c => c.cluster === topCluster);

        document.getElementById('res-cluster').innerText = topCluster;
        document.getElementById('res-desc').innerText = `You showed the strongest connection with career environments in ${topCluster}. You naturally resonate with the day-to-day responsibilities in this sector.`;

        const degreeList = document.getElementById('res-degrees');
        degreeList.innerHTML = "";
        winningSample.degrees.forEach(deg => {
            const li = document.createElement('li');
            li.innerText = deg;
            degreeList.appendChild(li);
        });
    }
</script>
</body>
</html>
